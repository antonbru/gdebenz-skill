# Шаблон конфигурации скилла gdebenz-api.
# Скопируйте в config.yaml (или задайте те же значения переменными окружения)
# и поменяйте под себя.

# Приоритетное топливо: 92, 95, ДТ и т.п.
fuel: "95"

# Запасное топливо, если основного нет нигде. Пустая строка = без fallback.
fallback: "92"

# Радиус поиска, км
radius_km: 5

# Сколько станций показывать в ответе
top_n: 8

# Показывать комментарии водителей (true/false)
comments: true

# Для скольких ближайших станций тянуть комментарии
comment_n: 5

# Язык ответа: ru / en
lang: "ru"
